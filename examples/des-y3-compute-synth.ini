[runtime]
sampler = test
verbosity = standard

; This parameter is used several times in this file, so is
; put in the DEFAULT section and is referenced below as %(2PT_FILE)s
[DEFAULT]
2PT_FILE = likelihood/des-y3/2pt_NG_final_2ptunblind_02_26_21_wnz_maglim_covupdate.fits #likelihood/des-y3/2pt_NG_final_2ptunblind_02_24_21_wnz_covupdate.v2.fits
; output DV name 
OUTPUT_DVNAME=likelihood/des-y3/sim_d-gen2pt_simy3_l-hm20-nla-magy3balfix_ml4_sy3_test_ccl.fits 
; location of your cosmosis standard library 
root=/Users/s2265800/Desktop/Work/cosmosis_stuff/cosmosis-standard-library
;action_postlike=save_2pt_simy3   
action_preboltzmann=   
2pt_data_sets=xip xim gammat wtheta    

[pipeline]
modules =  consistency  bbn_consistency
           ;camb  fast_pt
           fits_nz  lens_photoz_width  lens_photoz_bias  source_photoz_bias
           ;IA  pk_to_cl_gg  pk_to_cl
           ;add_magnification  add_intrinsic
           ;2pt_shear 2pt_gal  2pt_gal_shear
           ccl_comprehensive
           shear_m_bias   ;add_point_mass
           2pt_like  save_2pt_simy3 

timing=T
debug=F
priors = examples/des-y3-priors.ini
values = examples/des-y3-values.ini
extra_output = cosmological_parameters/sigma_8 cosmological_parameters/sigma_12 data_vector/2pt_chi2


; It's worth switching this to T when sampling using multinest, polychord,
; or other samplers that can take advantage of differences in calculation speeds between
; different parameters.
fast_slow = F
first_fast_module = shear_m_bias
; For some use cases this might be faster:
;first_fast_module=lens_photoz_width

[ccl_comprehensive]
file = structure/ccl/cl_with_ccl_modular.py

; ===== GENERAL COMPUTATION CONTROL =====
compute_background = T
compute_power_spectra = T
compute_growth = T
compute_halo_model = F

; ===== ANGULAR POWER SPECTRA =====
compute_gc = T                   ; Galaxy clustering
compute_shear = T                 ; Weak lensing shear
compute_cross = T                 ; Galaxy-shear cross-correlation
compute_cmb_lensing = F          ; CMB lensing cross-correlations

; ===== ADVANCED CCL FEATURES =====
; Emulator support
use_emulator_pk = F               ; BaccoemuNonlinear emulator

; Perturbative tracers
use_perturbative_bias = F         ; BaccoLbiasCalculator

; ===== CORRELATION FUNCTIONS - ALL CCL TYPES =====
; Angular correlation functions with all CCL correlation types
compute_xi = T                   ; Enable angular correlation functions
# Compute comprehensive 3x2pt analysis
xi_types = shear+, shear-, ng, gg ;gg, shear+, shear-, ng
xi_method = "fftlog"            ; Options: "fftlog" (fast), "bessel" (accurate), "legendre"
theta_min = 0.0166                ; Minimum angle (degrees) - finer than default, degrees in ccl
theta_max = 5.               ; Maximum angle (degrees) - wider than default, degrees in ccl
n_theta = 20                   ; Number of angular bins - more than default
do_rsd = True


; ===== ADVANCED ANGULAR_CL OPTIONS =====
; High-precision integration control
limber_integration = T          ; Use Limber approximation for speed
non_limber_max_ell = 200       ; Exact integration up to this ell
integration_method = "qag_quad" ; Integration method
relative_tolerance = 1.0e-4     ; Integration precision
l_logstep = 1.15               ; ℓ sampling control

; ===== ELL CONFIGURATION =====
ell_min_logspaced = 1.        ; Minimum ell
ell_max_logspaced = 5.0e5     ; Maximum ell
n_ell_logspaced = 100           ; Number of ell points

; ===== COSMOLOGY SETUP =====
transfer_function = "boltzmann_camb"
matter_power_spectrum = "camb"
halofit_version = "mead2020"

; ===== REDSHIFT AND K RANGES =====
z_min = 0.0
z_max = 3.0
n_z = 401
k_min = 1.0e-4
k_max = 50.0
n_k = 700


; This is the sampler used for the DES-Y3 releases.
[polychord]
base_dir = output/y3-polychord-checkpoints
polychord_outfile_root = y3
resume = F
feedback = 3
fast_fraction = 0.1

;Minimum settings
live_points = 250
num_repeats = 30
tolerance = 0.1

;Settings for paper runs
; live_points = 500
; num_repeats=60
; tolerance=0.01
; boost_posteriors=10.0

[output]
filename = output/des-y3-ccl.txt
format=text

; you can set this to T if you don't want 
privacy = F

[emcee]
walkers = 80
samples = 10000
nsteps = 5


; This sampler makes a 1D likelihood slice in each dimension
; It's handy for doing a thorough comparison to other codes
[star]
nsample_dimension = 20

[test]
save_dir=output/des-y3-testing
fatal_errors=T


[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = power
lmax = 2500          ;max ell to use for cmb calculation
feedback=3         ;amount of output to print
AccuracyBoost=1.1 ;CAMB accuracy boost parameter
do_tensors = T
do_lensing = T
NonLinear = pk
halofit_version = takahashi
zmin_background = 0.
zmax_background = 4.
nz_background = 401
kmin=1e-4
kmax = 50.0
kmax_extrapolate = 500.0
nk=700

[camb_planck]
file = boltzmann/camb/camb.so
mode=all
lmax=3000

feedback=0
do_tensors=T
do_lensing=T
do_nonlinear=T
high_ell_template=$COSMOSIS_SRC_DIR/boltzmann/camb/camb_Jan15/HighLExtrapTemplate_lenspotentialCls.dat

; because we will be using the Planck likelihood we also need to set the
; accuracy to higher values. This makes a big difference to the likelihood values (delta log L ~ 36)
accuracy_boost=1.1  ;CAMB accuracy boost parameter
high_accuracy_default=T

; set these if you are doing lensing:
; lmax = 4500
; max_eta_k = 500000
; use_nonlinear_lensing = T


[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[fits_nz]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = lens source
prefix_section = T
prefix_extension = T

[fits_nz_lens]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = %(2PT_FILE)s
data_sets = lens
prefix_section = T
prefix_extension = T

[lens_photoz_width]
file = number_density/photoz_width/photoz_width.py
mode = stretch
sample = nz_lens
bias_section = lens_photoz_errors
interpolation = linear

[lens_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_lens
bias_section = lens_photoz_errors
interpolation = linear

; hyperrank and source_photoz_bias are exclusive
[hyperrank]
file = number_density/nz_multirank/nz_multirank.py
nz_file = %(2PT_FILE)s
data_set = source
dimensions = 3
bin_ranks= 1 2 4 

[source_photoz_bias]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = wl_photoz_errors
interpolation = linear

[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F

[IA]
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = tatt

[pk_to_cl_gg]
file = structure/projection/project_2d.py
lingal-lingal = lens-lens
do_exact = lingal-lingal
do_rsd = True
ell_min_linspaced = 1
ell_max_linspaced = 4
n_ell_linspaced = 5
ell_min_logspaced = 5.
ell_max_logspaced = 5.e5
n_ell_logspaced = 80
limber_ell_start = 200
ell_max_logspaced=1.e5
auto_only=lingal-lingal
sig_over_dchi_exact = 3.5

[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 0.1
ell_max_logspaced = 5.0e5
n_ell_logspaced = 100 
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
intrinsicb-intrinsicb=source-source
lingal-shear = lens-source
lingal-intrinsic = lens-source
lingal-magnification = lens-lens
magnification-shear = lens-source
magnification-magnification = lens-lens
magnification-intrinsic = lens-source 
verbose = F
get_kernel_peaks = F
sig_over_dchi = 20. 
shear_kernel_dchi = 10. 

[add_magnification]
file = structure/magnification/add_magnification.py
include_intrinsic=T

[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear=T
position-shear=T
perbin=F

[add_eb]
file = intrinsic_alignments/add_b_mode/add_b_mode_cl.py

[2pt_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type = EB
theta_file=%(2PT_FILE)s
bin_avg = T
; these get
input_section_name = shear_cl  shear_cl_bb
output_section_name = shear_xi_plus  shear_xi_minus

[2pt_gal]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type='00'
theta_file=%(2PT_FILE)s
bin_avg = T

[2pt_gal_shear]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
ell_max = 40000
xi_type='02'
theta_file=%(2PT_FILE)s
bin_avg = T

[shear_m_bias]
file = shear/shear_bias/shear_m_bias.py
m_per_bin = True
; Despite the parameter name, this can operate on xi as well as C_ell.
cl_section = shear_xi_plus shear_xi_minus
cross_section = galaxy_shear_xi
verbose = F

[save_2pt_simy3]
file       	 = 	 likelihood/2pt/save_2pt.py  
theta_min  	 = 	 2.5  
theta_max  	 = 	 250.0  
n_theta    	 = 	 20  
real_space 	 = 	 T  
make_covariance 	 = 	 F  
shear_nz_name 	 = 	 nz_source  
position_nz_name 	 = 	 nz_lens  
filename   	 = 	 %(OUTPUT_DVNAME)s  
overwrite  	 = 	 T  
auto_only  	 = 	 galaxy_xi  
spectrum_sections 	 = 	 shear_xi_plus shear_xi_minus galaxy_shear_xi galaxy_xi  
output_extensions 	 = 	 xip xim gammat wtheta  
two_thirds_midpoint 	 = 	 T  
copy_covariance 	 = 	 %(2pt_file)s

[add_point_mass]
file=shear/point_mass/add_gammat_point_mass.py
add_togammat = False
use_fiducial = True
sigcrit_inv_section = sigma_crit_inv_lens_source

[2pt_like]
file = likelihood/2pt/2pt_like.py ;likelihood/2pt/2pt_point_mass/2pt_point_mass.py
do_pm_marg = True
do_pm_sigcritinv = True
sigma_a = 10000.0
no_det_fac = False
include_norm = False
data_file = %(2PT_FILE)s
data_sets = xip xim gammat wtheta
make_covariance=F
covmat_name=COVMAT

; we put these in a separate file because they are long
;%include examples/des-y3-scale-cuts.ini


