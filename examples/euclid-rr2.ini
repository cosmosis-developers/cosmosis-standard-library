[runtime]
resume = T
sampler = test
verbosity = standard


[DEFAULT]
2PT_FILE = reduced_2_euclid_rr2_2.1_summary_statistics_fourier.sacc


[pipeline]
fast_slow = F
values = examples/euclid-rr2-values.ini
priors = examples/euclid-rr2-priors.ini

modules =
    consistency
    camb
    sacc_nz
    IA
    ia_z_field
    pk_to_cl
    add_intrinsic
    2pt_shear_nicaea ; not actually needed for Fourier version but not slow
    sacc_like

extra_output = cosmological_parameters/S_8
timing=F
debug=F


[output]
filename = output/euclid-rr2-fourier.txt
format=text
privacy = F

[test]
fatal_errors=T
save_dir= output/euclid-rr2-fourier

[maxlike]
max_posterior = T

[nautilus]
n_live = 1000
resume = True


[camb]
file = boltzmann/camb/camb_interface.py
mode = power
feedback=0
AccuracyBoost=1.0
do_tensors = F
do_lensing = F
kmin = 1e-4
kmax = 50.0
nk   = 500
NonLinear = pk
neutrino_hierarchy = normal
halofit_version = mead2020_feedback
zmin_background = 0.
zmax_background = 4.
nz_background = 401
kmax_extrapolate = 500.0


[consistency]
file = utility/consistency/consistency_interface.py



[sacc_nz]
file = number_density/load_nz_sacc/load_nz_sacc.py
nz_file = %(2PT_FILE)s
data_sets = source
prefix_extension = T


[IA]
file=./intrinsic_alignments/la_model/linear_alignments_interface.py
do_galaxy_intrinsic=F
method=bk_corrected

[ia_z_field]
file = ./intrinsic_alignments/z_powerlaw/ia_z_powerlaw.py
do_galaxy_intrinsic = F


[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 1.0
ell_max_logspaced = 20000.0
n_ell_logspaced = 200
shear-shear = source-source
intrinsic-intrinsic = source-source
shear-intrinsic = source-source
verbose=F

[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = F
perbin=F
position-shear=F

[cl_to_xi]
file = shear/cl_to_xi_fullsky/cl_to_xi_interface.py
xi_type = "22"
ell_max = 20000
theta_file =  %(2PT_FILE)s

[sacc_like]
file = likelihood/sacc/sacc_like.py
like_name = 2pt_like
sacc_like =  twopoint
data_file = %(2PT_FILE)s
data_sets = galaxy_shear_cl_ee
include_norm = F

angle_range_galaxy_shear_cl_ee_source_0_source_0 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_1_source_0 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_1_source_1 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_2_source_0 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_2_source_1 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_2_source_2 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_3_source_0 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_3_source_1 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_3_source_2 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_3_source_3 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_4_source_0 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_4_source_1 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_4_source_2 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_4_source_3 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_4_source_4 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_5_source_0 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_5_source_1 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_5_source_2 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_5_source_3 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_5_source_4 = 80. 3000.
angle_range_galaxy_shear_cl_ee_source_5_source_5 = 80. 3000.




[2pt_shear_nicaea]
file = ./shear/cl_to_xi_nicaea/nicaea_interface.so
corr_type = 0  ; shear_cl -> shear_xi
