[runtime]
resume = T
sampler = nautilus
verbosity = standard


[DEFAULT]
2PT_FILE = reduced_euclid_rr2_2.1_summary_statistics_fourier.sacc

[pipeline]
fast_slow = F
values = examples/euclid-rr2-values.ini
priors = examples/euclid-rr2-priors.ini

modules =
    consistency
    camb
    sacc_nz
    IA
    ia_z_field
    pk_to_cl
    add_intrinsic
    sacc_like

extra_output =
            cosmological_parameters/sigma_8
            cosmological_parameters/S_8
            data_vector/2pt_chi2
timing=F
debug=F



[output]
filename = output/euclid-rr2.txt
format=text
privacy = F

[test]
fatal_errors=T
save_dir= output/hsc-y3-shear

[maxlike]
max_posterior = T

[nautilus]
n_live = 1000
resume = True


[camb]
file = boltzmann/camb/camb_interface.py
mode = power
feedback=0
AccuracyBoost=1.0
do_tensors = F
do_lensing = F
kmin = 1e-4
kmax = 50.0
nk   = 500
NonLinear = pk
neutrino_hierarchy = normal
halofit_version = mead2020_feedback
zmin_background = 0.
zmax_background = 4.
nz_background = 401
kmax_extrapolate = 500.0


[consistency]
file = utility/consistency/consistency_interface.py



[sacc_nz]
file = number_density/load_nz_sacc/load_nz_sacc.py
nz_file = %(2PT_FILE)s
data_sets = source
prefix_extension = T


[IA]
file=./intrinsic_alignments/la_model/linear_alignments_interface.py
do_galaxy_intrinsic=F
method=bk_corrected

[ia_z_field]
file = ./intrinsic_alignments/z_powerlaw/ia_z_powerlaw.py
do_galaxy_intrinsic = F


[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 1.0
ell_max_logspaced = 3000.0
n_ell_logspaced = 100
shear-shear = source-source
intrinsic-intrinsic = source-source
shear-intrinsic = source-source
verbose=F



[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = F
perbin=F
position-shear=F


[sacc_like]
file = likelihood/sacc/sacc_like.py
like_name = 2pt_like
sacc_like =  twopoint
data_file = %(2PT_FILE)s
data_sets = galaxy_shear_cl_ee
sellentin = F
