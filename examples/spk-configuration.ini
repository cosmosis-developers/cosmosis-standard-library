; SP(k) configuration examples.
; This file is a snippet library to copy into an existing Cosmosis pipeline
; that already produces matter_power_nl.

[spk]
file = structure/spk/spk_interface.py
SO = 500
verbose = F
extrapolate = F
; Optional for binned mode:
; fb_table = structure/spk/BAHAMAS_fb_M200.csv

; Choose exactly ONE of the following input sets in [spk] values:
;
; 1) power_law
; fb_a = 0.40
; fb_pow = 0.30
; fb_pivot = 3.16e13
;
; 2) cosmo_power_law
; alpha = 4.16
; beta = 1.20
; gamma = 0.39
;
; 3) double_power_law
; epsilon = 0.41
; alpha = -0.385
; beta = 0.451
; gamma = 0.125
; m_pivot = 1.0e13
;
; 4) binned relation
; set fb_table above and do not set any [spk] values below.
