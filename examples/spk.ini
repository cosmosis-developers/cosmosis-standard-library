[runtime]
sampler = test
verbosity = standard

[test]
save_dir = output/spk
fatal_errors = T

[pipeline]
modules = consistency camb spk
values = examples/spk_values.ini
debug = F
timing = F

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = cmb
feedback = 0
AccuracyBoost = 1.1
NonLinear = pk
zmin = 0.0
zmax = 3.0
nz = 4
kmax = 8.0
kmax_extrapolate = 8.0

[spk]
file = structure/spk/spk_interface.py
SO = 500
z_out_of_range = raise
input_section = matter_power_nl
output_section = matter_power_nl
suppression_section = spk_suppression
verbose = F
extrapolate = F
