name: "spk"
version: "v2.0"
purpose: "A hydrodynamical simulation-based model for the impact of baryon physics on the non-linear matter power spectrum"
url: "https://github.com/jemme07/pyspk/"
interface: "spk_interface.py"
attribution: [Jaime Salcido, Ian McCarthy, Juliana Kwan, Amol Upadhye, Andreea Font]
rules:
    Please cite the papers below if you use this code in your research"
cite:
    - "https://doi.org/10.1093/mnras/stad1474"

assumptions:
    - "Requires external package pyspk (>=2.0) and its dependencies"
    - "Install with: pip install pyspk"

explanation: 
    py-SP(k) (Salcido et al. 2023) is a python package aimed at predicting the suppression of the 
    total matter power spectrum due to baryonic physics as a function of the baryon fraction of haloes and redshift.

    This Cosmosis interface supports exactly one SP(k) relation mode at a time:

    1. Power law: fb_a, fb_pow, optional fb_pivot
    2. Cosmology-based redshift-dependent power law: alpha, beta, gamma
    3. Redshift-dependent double power law: epsilon, alpha, beta, gamma, m_pivot
    4. Binned relation from a table: fb_table module option

    A jupyter notebook with more detailed examples can be found within the pyspk repository at
    https://github.com/jemme07/pyspk/blob/main/examples/pySPk_Examples.ipynb

    WARNING - if the combination of parameters and your choice for the functional form of the 
    baryon fraction - halo mass relation goes outside the SP(k) fitting limits, pyspk returns NaN values.
    This can happen easily at high-z and high-k will return an error to cosmosis.  This SP(k) parameter combination will
    then be given a likelihood of zero, thus creating a theoretical prior that you should be aware of.


params:
    SO:
        meaning: The spherical overdensity, which must be 200 or 500. The halo mass then corresponds to the 
                 mass with a radius where the mean density is 200 or 500 times the critical density of the Universe.
        type: int
        default: 500
    verbose:
        meaning: Run in verbose mode
        type: bool
        default: False
    fb_table:
        meaning: Optional for binned mode only. Name of file containing baryon fraction as a function of halo mass and redshift.
                 Format - Redshift, Halo mass [M_odot], Baryon fraction (normalised by the Universal baryon fraction)
                 The file BAHAMAS_fb_M200.csv provides this data from the BAHAMAS simulations (McCarthy et al. 2017).
                 If provided, do not set any SP(k) input parameters in [spk] values.
        type: str
        default: 
    extrapolate:
        meaning: Allow SP(k) interpolation/extrapolation for binned mode when masses fall outside table range.
        type: bool
        default: False

inputs:
    fb_a:
        meaning: Power-law mode normalization. Set only with fb_pow (optional fb_pivot).
        type: float
        default:
    fb_pow:
        meaning: Power-law mode exponent. Set only with fb_a (optional fb_pivot).
        type: float
        default:
    fb_pivot:
        meaning: Power-law mode pivot mass in M_sun units.
        type: float
        default: 1.0
    alpha:
        meaning: Cosmology power-law normalization or double power-law low-mass slope.
        type: float
        default:
    beta:
        meaning: Cosmology power-law slope or double power-law high-mass slope.
        type: float
        default:
    gamma:
        meaning: Redshift dependence for cosmology power-law or double power-law mode.
        type: float
        default:
    epsilon:
        meaning: Double power-law normalization.
        type: float
        default:
    m_pivot:
        meaning: Double power-law pivot mass in M_sun units.
        type: float
        default:
    matter_power_nl:
        z:
            meaning: Redshifts of samples.
            type: real 1d
        k_h:
            meaning: Wavenumbers k of samples in Mpc/h.
            type: real 1d
        P_k:
            meaning: Non-linear power spectrum at samples in (Mpc/h)^-3 before SP(k) correction.
            type: real 2d


outputs:
    matter_power_nl:
        z:
            meaning: Redshifts of samples. 
            type: real 1d
        k_h:
            meaning: Wavenumbers k of samples in Mpc/h.
            type: real 1d
        P_k:
            meaning: Non-linear power spectrum at samples in (Mpc/h)^-3, including SP(k) baryon correction.
            type: real 2d
