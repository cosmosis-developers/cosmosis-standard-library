; This is an example using the HSC Year 3 cosmic shear data.
; It is based on Dalal et al, but that work used the power spectrum
; the power spectrum from the linear BACCO emulator and pyhmcode2016, the
; interfaces for which are not public immediately. Results may be slightly
; different, but S_8 constraints should match well.
[runtime]
root = ${PWD}/..


[DEFAULT]
2PT_FILE = ./test_uncertainties.sacc

[pipeline]
fast_slow = F
values = values.ini
priors = priors.ini

modules =
    consistency
    camb
    extrapolate
    sacc_load_nz
    sacc_nz_uncertainty
    pk_to_cl
    sacc_like

extra_output = cosmological_parameters/S_8
timing=F
debug=F

[runtime]
resume = T
sampler = test
verbosity = standard

[output]
filename = output/chain.txt
format=text
privacy = F

[star]
nsample_dimension = 11


[test]
fatal_errors=T
save_dir= output/test


[nautilus]
n_live = 2000
resume = True

[hmcode_eta]
file = structure/hmcode_eta/hmcode_eta.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = power
feedback=0
AccuracyBoost=1.0
do_tensors = F
do_lensing = F
kmin = 1e-4
kmax = 50.0
nk   = 500
NonLinear = pk
neutrino_hierarchy = normal
halofit_version = original
zmin_background = 0.
zmax_background = 4.
nz_background = 401
kmax_extrapolate = 500.0


[consistency]
file = utility/consistency/consistency_interface.py


[extrapolate]
file = boltzmann/extrapolate/extrapolate_power.py
kmax = 500.0
nmax = 100

[sacc_load_nz]
file = number_density/load_nz_sacc/load_nz_sacc.py
nz_file = %(2PT_FILE)s
data_sets = source lens
prefix_extension = T

[sacc_nz_uncertainty]
file = number_density/sacc_tracer_uncertainty/nz_prior_interface.py
sacc_file = %(2PT_FILE)s
section_names = nz_source nz_lens
uncertainty_name = Shifts
; uncertainty_name = ShiftsWidths

[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 20.
ell_max_logspaced = 3500.0
n_ell_logspaced = 200
shear-shear = source-source
verbose = F
get_kernel_peaks=F



[sacc_like]
file = likelihood/sacc/sacc_like.py
like_name = sacc
sacc_like =  twopoint
include_norm=F
data_file = %(2PT_FILE)s
data_sets = galaxy_shear_cl_ee
sellentin = F
