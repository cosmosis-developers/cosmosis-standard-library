name: "des_dovekie"
version: "1.0"
purpose: "DES Year 5 Supernova likelihood (Dovekie sample)"
url: "https://github.com/des-science/DES-SN5YR"
interface: "des_dovekie_like.py"
attribution: ["DES Collaboration"]
rules: "Please cite DES Collaboration (2024)."
cite: 
    - "https://arxiv.org/abs/2401.02929"

params:
    data_file: "String. Path to the CSV data vector (default: DES-Dovekie_HD_clean.csv)."
    covmat_file: "String. Path to the inverse covariance matrix (default: STAT+SYS.npz)."

inputs:
    distances:
        z: "Real 1D array. Redshift array."
        d_l: "Real 1D array. Luminosity distance in Mpc."
        mu: "Real 1D array. Distance modulus (optional, calculated if not provided)."

outputs:
    likelihoods:
        des_dovekie_like: "Real. The computed log-likelihood."
