[runtime]
#sampler = test
sampler = rose
root = ${PWD}
verbosity = standard

[test]
save_dir=output/rose_example
fatal_errors=T


[output]
filename = output/rose_example.txt
format=text

[rose]
# number of iterations to run for the training
iterations = 5

# initial size of the training set
initial_size = 100

# resample size for the training = additional points to add to the training set per iteration
resample_size = 50

# NN settings:
batch_size = 32
training_iterations = 3

# prior module to use for the neural network in the final sampling phase or when re-using the trained models
# since we're substituting the whole pipeline with just one module for the emulated datavector, 
# we need to add a prior-module to the emulated pipeline when required
prior_module = w0waprior

# Saving models and re-loading/re-using them:
# options to save models in each training cycle or only the final model, as well as training and testing sets
save_output = all # or last or none

# MCMC settings:
emcee_walkers = 30
emcee_samples = 3000
emcee_burn = 0.3
emcee_thin = 1


[pipeline]
; these names refer to sections later in the file:
modules = w0waprior consistency camb desi_y2 pantheon   #lollipop hillipop
values = examples2/planck_values.ini
priors = 
debug=T
timing=F

[planck]
file = likelihood/planck_py/planck_py_interface.py 
use_low_ell_bins = T
spectra = TTTEEE
year = 2018

[hillipop]
file = likelihood/cmb/planck/hillipop/hillipop_interface.py
; Using TTTEEE mode means that cache is too large to stay
; in Github Actions, so we just test the TT mode alone
; mode = TTTEEE
mode = TT

[lollipop]
file = likelihood/cmb/planck/lollipop/lollipop_interface.py
mode = lowlEB

[desi_y2]
file = likelihood/bao/desi-dr2/desi_dr2.py
desi_data_sets = 

[pantheon]
file = likelihood/pantheon/pantheon.py
; NOTE: must stay F for the rose emulator. With likelihood_only=T the
; Gaussian likelihood returns early and never writes
; data_vector/pantheon_theory (+ _data/_covariance/_inverse_covariance),
; so rose can't register/emulate Pantheon separately and the patched
; likelihood falls back to the (DESI-only) concatenated theory vector,
; giving a shape mismatch (13 vs 40).
likelihood_only = F


; The consistency module translates between our chosen parameterization
; and any other that modules in the pipeline may want (e.g. camb)
[consistency]
file = ./utility/consistency/consistency_interface.py
; h0 is sampled directly in the values file, so theta mode must stay off.
; Turning it on makes the module derive cosmomc_theta from h0 and convert
; back, and the round-trip mismatch over-specifies the cosmology.
cosmomc_theta = F

[w0waprior]
file = utility/exclude_w0_wa/w0wa_sum_prior.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = background
lmax = 2800          ;max ell to use for cmb calculation
feedback=0         ;amount of output to print
AccuracyBoost=1.1 ;CAMB accuracy boost parameter
do_tensors = True   ;include tensor modes
do_lensing = true    ;lensing is required w/ Planck data
NonLinear = lens
accurate_massive_neutrino_transfers = T
theta_H0_range = "20 100"
use_ppf_w = True
; We need quite fine redshift spacing, because the supernovae
; go down to low z where things are pretty sensitive.
; Note: pantheon.py drops the first grid point (z=0), so the effective
; interpolation floor is the *second* grid point (zmin + spacing).
; The lowest Pantheon SN is at z=0.014, so the spacing (3.0/(nz-1))
; must be < 0.014, i.e. nz_background must be > ~215.
nz_background = 300
zmin_background = 0.0 
zmax_background = 3.0
